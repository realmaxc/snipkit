version: 2
project_name: snipkit

before:
  hooks:
    - go mod tidy

builds:
  - id: snipkit
    main: ./cmd/snipkit
    binary: snipkit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/realmaxc/snipkit/internal/version.Version={{ .Version }}
      - -X github.com/realmaxc/snipkit/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/realmaxc/snipkit/internal/version.Date={{ .Date }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
